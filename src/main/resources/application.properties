spring.application.name=AlphaCodeReviewer
server.port=5050

#database configurations
#.....
#spring.data.mongodb.host=localhost
#spring.data.mongodb.port=27017
#spring.data.mongodb.database=your_database_name
## Optional: if authentication is enabled
#spring.data.mongodb.username=your_username
#spring.data.mongodb.password=your_password
## Optional: if using a specific authentication database
#spring.data.mongodb.authentication-database=admin


#github configurations
github.token=<your-token>
github.images.db.repo.name=AlphaCodeReviewer-DB
github.repo.owner=Twister0011
github.repo.branch=main
#email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=springbootdeveloper8@gmail.com
spring.mail.password=<Your Email password>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
#email receiving config
mail.store.protocol=imaps
mail.imaps.host=imap.gmail.com
mail.imaps.port=993
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
sender.mail=springbootdeveloper8@gmail.com


#kafka configurations

#producer configuration
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

#consumer configuration
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=group-id
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

#open-ai configurations

spring.ai.openai.api-key=<your-open-ai-api-key-value>

#ollama local configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=mistral
spring.ai.ollama.chat.options.temperature=0.7
